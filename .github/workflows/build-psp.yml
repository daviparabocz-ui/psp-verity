name: Build PSP EBOOT

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-psp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP from repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )

          if (( ${#zips[@]} == 0 )); then
            echo "::error::No .zip file found in the repository root."
            exit 1
          fi

          if (( ${#zips[@]} > 1 )); then
            echo "::error::More than one .zip file found in the repository root. Keep only the intended source ZIP there."
            printf 'Found: %s\n' "${zips[@]}"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-src"
          unzip -q "${zips[0]}" -d "$GITHUB_WORKSPACE/build-src"

          echo "Extracted: ${zips[0]}"
          find "$GITHUB_WORKSPACE/build-src" -maxdepth 3 -type f | head -200
      - name: Diagnose and build with PSPDEV Docker
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/build-src:/source" \
            -w /source \
            pspdev/pspdev:latest \
            bash -lc '
              set -uo pipefail

              echo "=== Environment ==="
              echo "PSPDEV=${PSPDEV:-<unset>}"
              echo "PATH=$PATH"

              if [ -n "${PSPDEV:-}" ]; then
                export PATH="$PSPDEV/bin:$PATH"
              fi

              echo "=== Tool discovery ==="
              command -v psp-gcc || true
              command -v psp-config || true
              find /usr/local /opt -type f \
                \( -name psp-gcc -o -name psp-config \) \
                -print 2>/dev/null | head -50

              if ! command -v psp-gcc >/dev/null 2>&1; then
                echo "ERROR: psp-gcc was not found. Check the image/toolchain."
                exit 1
              fi

              makefile="$(find /source -type f \
                \( -name Makefile -o -name makefile \) \
                -print -quit)"

              if [ -z "$makefile" ]; then
                echo "ERROR: No Makefile found in extracted ZIP."
                exit 1
              fi

              cd "$(dirname "$makefile")"
              echo "=== Building in $PWD ==="
              make -j2
            '

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: PSP-EBOOT
          path: build-src/**/EBOOT.PBP
          if-no-files-found: error
          retention-days: 14
          
